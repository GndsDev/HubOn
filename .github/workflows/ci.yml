name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hubon_test
          POSTGRES_USER: hubon_user
          POSTGRES_PASSWORD: hubon_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubon_user -d hubon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/hubon_test
          TEST_DB_USERNAME: hubon_user
          TEST_DB_PASSWORD: hubon_test_password
          TEST_HUBON_JWT_SECRET: ci-test-secret-with-enough-length-for-integration-tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build images
        run: docker compose --env-file .env.example build
