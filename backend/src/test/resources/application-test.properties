spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/hubon_test}
spring.datasource.username=${TEST_DB_USERNAME:hubon_user}
spring.datasource.password=${TEST_DB_PASSWORD:hubon_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

hubon.security.permit-all=false
hubon.seed.enabled=false

hubon.jwt.secret=${TEST_HUBON_JWT_SECRET:test-secret-with-enough-length-for-integration-tests}
hubon.jwt.expiration-minutes=60
